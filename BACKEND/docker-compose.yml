version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rideshare_postgres
    environment:
      POSTGRES_USER: rideshare_user
      POSTGRES_PASSWORD: rideshare_password
      POSTGRES_DB: rideshare_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - rideshare_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rideshare_user -d rideshare_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rideshare_redis
    ports:
      - "6379:6379"
    networks:
      - rideshare_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rideshare_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://rideshare_user:rideshare_password@postgres:5432/rideshare_db
      REDIS_URL: redis://redis:6379
      ACCESS_TOKEN_SECRET: access_super_secret_key_12345
      REFRESH_TOKEN_SECRET: refresh_super_secret_key_67890
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rideshare_net

volumes:
  postgres_data:

networks:
  rideshare_net:
    driver: bridge